{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create a staff account</h1>
  <p class="muted">An account gives no access on its own. A super admin grants a role after you sign in.</p>
  <form method="post" action="{{ url_for('main.signup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
    <label for="password">Password <span class="muted">(12+ characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <button class="primary" type="submit">Create account</button>
  </form>
  <p class="muted"><a href="{{ url_for('main.login') }}">Back to sign-in</a></p>
</section>
{% endblock %}
